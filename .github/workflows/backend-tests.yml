name: Backend tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: yacs_test
          POSTGRES_USER: yacs_test
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yacs_test -d yacs_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_ENV: test
      SECRET_KEY: ci-test-session-signing-key-never-use-in-production
      TEST_DATABASE_URL: postgresql://yacs_test:test_only_password@localhost:5432/yacs_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run backend tests and coverage
        run: >-
          python -m pytest
          --cov=backend/routers --cov=backend/services
          --cov-report=term-missing --cov-report=xml:backend/coverage.xml
          --junitxml=backend/test-results.xml
      - name: Upload test and coverage reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-test-results
          path: |
            backend/coverage.xml
            backend/test-results.xml
          if-no-files-found: ignore
